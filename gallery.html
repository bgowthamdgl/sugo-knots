<h1>SUGO KNOTS</h1>
h1{
    text-align:center;
    color:#7b4b94;
    padding:30px;
    font-size:2.5rem;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    padding:20px;
    max-width:1400px;
    margin:auto;
}

.gallery figure{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    text-align:center;
    transition:.3s;
}

.gallery figure:hover{
    transform:translateY(-5px);
}

.gallery img{
    width:100%;
    height:300px;
    object-fit:cover;
    display:block;
}

.gallery figcaption{
    padding:15px;
    color:#7b4b94;
    font-weight:600;
    font-size:15px;
}

</style>
