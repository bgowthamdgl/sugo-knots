<title>SUGO KNOTS Gallery</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:'Segoe UI',sans-serif;
    background:#faf7fc;
}

h1{
    text-align:center;
    color:#7b4b94;
    padding:30px 0;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
    max-width:1400px;
    margin:auto;
}

.gallery img{
    width:100%;
    height:320px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    transition:0.3s;
}

.gallery img:hover{
    transform:scale(1.05);
}

</style>

</head>
