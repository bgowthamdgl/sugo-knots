<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUGO KNOTS Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#faf7fc;
}

/* Watermark */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image:url('./images/sugo-watermark.png');
    background-repeat:no-repeat;
    background-position:center;
    background-size:500px;
    opacity:0.08;
    pointer-events:none;
    z-index:-1;
}

/* Navigation */

nav{
    position:sticky;
    top:0;
    background:#7b4b94;
    padding:15px;
    text-align:center;
    z-index:9999;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

nav a:hover{
    color:#ffe3fa;
}

h1{
    text-align:center;
    color:#7b4b94;
    padding:30px;
    font-size:2.5rem;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    padding:20px;
    max-width:1400px;
    margin:auto;
}

.gallery figure{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    text-align:center;
    transition:.3s;
}

.gallery figure:hover{
    transform:translateY(-5px);
}

.gallery img{
    width:100%;
    height:300px;
    object-fit:cover;
    display:block;
}

.gallery figcaption{
    padding:15px;
    color:#7b4b94;
    font-weight:600;
    font-size:15px;
}

footer{
    text-align:center;
    padding:25px;
    margin-top:40px;
    background:#7b4b94;
    color:white;
}

</style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="catalog.html">Catalog</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
</nav>

<h1>SUGO KNOTS Gallery</h1>

<div class="gallery">

<figure>
<img src="images/Bell%20Collar%20Baby%20Elephant%20Lamp.jpeg" alt="Bell Collar Baby Elephant Lamp">
<figcaption>Bell Collar Baby Elephant Lamp</figcaption>
</figure>

<figure>
<img src="images/Carrot%20Hat%20Kitty%20Plush.jpeg" alt="Carrot Hat Kitty Plush">
<figcaption>Carrot Hat Kitty Plush</figcaption>
</figure>

<figure>
<img src="images/Crispy%20Fries%20Capybara%20Plushie.jpeg" alt="Crispy Fries Capybara Plushie">
<figcaption>Crispy Fries Capybara Plushie</figcaption>
</figure>

<figure>
<img src="images/Garden%20Bunny%20with%20Sunflower%20Bag.jpeg" alt="Garden Bunny with Sunflower Bag">
<figcaption>Garden Bunny with Sunflower Bag</figcaption>
</figure>

<figure>
<img src="images/Lavender%20Sprout%20Penguin%20Plushie.jpeg" alt="Lavender Sprout Penguin Plushie">
<figcaption>Lavender Sprout Penguin Plushie</figcaption>
</figure>

<!-- Add remaining products here using the same pattern -->

</div>

<footer>
© 2026 SUGO KNOTS | Handmade with Love 💜
</footer>

</body>
</html>
