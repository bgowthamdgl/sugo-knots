<title>SUGO KNOTS Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#faf7fc;
}

/* Watermark */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image:url('./images/sugo-watermark.png');
    background-repeat:no-repeat;
    background-position:center;
    background-size:500px;
    opacity:0.08;
    pointer-events:none;
    z-index:-1;
}

/* Navigation */
nav{
    position:sticky;
    top:0;
    background:#7b4b94;
    padding:18px;
    text-align:center;
    z-index:9999;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 18px;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:#ffe3fa;
}

h1{
    text-align:center;
    color:#7b4b94;
    padding:30px 20px 10px;
    font-size:2.5rem;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
    font-size:1.1rem;
}

/* Gallery */

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    padding:20px;
    max-width:1400px;
    margin:auto;
}

.gallery figure{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
    text-align:center;
    transition:all .3s ease;
}

.gallery figure:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 30px rgba(123,75,148,.25);
}

.gallery img{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
    transition:transform .4s ease;
}

.gallery figure:hover img{
    transform:scale(1.05);
}

.gallery figcaption{
    padding:18px;
    color:#7b4b94;
    font-size:16px;
    font-weight:700;
}

/* Footer */

footer{
    text-align:center;
    padding:30px;
    margin-top:50px;
    background:#7b4b94;
    color:white;
}

</style>
</head>
